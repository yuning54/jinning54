<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>锦时予宁 | 永恒珍藏版 · 引用回声</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #eef2f7;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-app {
            width: 100%;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .view.hidden {
            display: none;
        }

        .chat-header {
            padding: 14px 20px;
            background: #ffffff;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            transition: background-color 0.2s;
        }
        
        .contact-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .contact-header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef2f6;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .contact-header-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1e2a3e;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .settings-cog, .feature-icon {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.1s;
            line-height: 1;
            opacity: 0.65;
        }
        
        .settings-cog:active, .feature-icon:active { opacity: 1; transform: scale(0.96); }

        .messages-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .messages-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            z-index: 2;
        }
        
        .messages-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 100%;
            animation: fadeSlideUp 0.2s ease-out;
        }
        
        .message-row.user {
            flex-direction: row-reverse;
        }
        
        .message-row.contact {
            flex-direction: row;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #eef2f6;
        }
        
        .message-content {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            width: fit-content;
            min-width: 40px;
        }
        
        /* 引用块样式 - 独立于气泡，不参与气泡宽度计算 */
        .quote-badge {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.08);
            border-left: 3px solid #9aaebf;
            padding: 4px 8px;
            margin-bottom: 6px;
            border-radius: 12px;
            color: #5b6e8c;
            max-width: 260px;
            word-break: break-word;
            white-space: pre-wrap;
            font-style: normal;
            display: inline-block;
            width: auto;
        }
        .user .quote-badge {
            background: rgba(0,0,0,0.06);
            border-left-color: #8ba3bc;
        }
        .contact .quote-badge {
            background: rgba(0,0,0,0.05);
        }
        
        .bubble {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
            transition: background-color 0.1s, color 0.1s;
            width: fit-content;
            max-width: 100%;
        }
        
        .message-content .bubble {
            display: inline-block;
        }
        
        .bubble-image {
            padding: 4px;
            max-width: 220px;
        }
        
        .bubble-image img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 14px;
            cursor: pointer;
        }
        
        .bubble-emoji {
            padding: 6px 10px;
        }
        
        .bubble-emoji img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 14px;
        }
        
        .user .bubble {
            border-bottom-right-radius: 6px;
        }
        
        .contact .bubble {
            border-bottom-left-radius: 6px;
        }
        
        .timestamp {
            font-size: 0.65rem;
            color: #9aaebf;
            margin-top: 4px;
            margin-left: 8px;
            margin-right: 8px;
        }
        
        .user .timestamp {
            text-align: right;
        }
        
        .user .message-content {
            align-items: flex-end;
        }
        
        .contact .message-content {
            align-items: flex-start;
        }

        .input-area {
            padding: 12px 18px 18px;
            background: #ffffff;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s;
        }
        
        .input-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            padding-left: 4px;
        }
        
        .tool-icon {
            background: none;
            border: none;
            font-size: 1.45rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.1s;
            opacity: 0.7;
        }
        
        .tool-icon:active {
            opacity: 1;
            transform: scale(0.95);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: #f1f3f7;
            border-radius: 28px;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        
        .input-wrapper input:focus {
            background: #e8ecf2;
        }

        .input-wrapper button {
            background: #f1f3f7;
            border: none;
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        
        .input-wrapper button:active {
            transform: scale(0.97);
            background: #e2e8f0;
        }

        /* 功能页样式 (番茄钟) */
        .feature-view {
            background: #fefefe;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .feature-header {
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            background: #f0f2f5;
            border: none;
            font-size: 1.3rem;
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s;
        }
        .back-btn:active { transform: scale(0.96); background: #e4e8ef; }
        .feature-header h2 {
            font-size: 1.25rem;
            font-weight: 520;
            color: #1e2a3e;
        }
        .pomodoro-container {
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }
        .timer-display {
            font-size: 4.2rem;
            font-weight: 600;
            font-family: monospace;
            letter-spacing: 4px;
            background: #f1f5f9;
            padding: 20px 32px;
            border-radius: 60px;
            color: #1e293b;
            box-shadow: inset 0 1px 3px #0001, 0 5px 12px rgba(0,0,0,0.05);
        }
        .task-section {
            width: 100%;
            max-width: 320px;
            background: #f8fafc;
            border-radius: 32px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .task-row, .duration-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .task-row label, .duration-row label {
            font-weight: 500;
            color: #334155;
            min-width: 70px;
        }
        .task-row input, .duration-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 28px;
            border: 1px solid #e2e8f0;
            background: white;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .duration-row input {
            width: 100px;
            text-align: center;
        }
        .control-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .tomato-btn {
            background: #1e2a3e;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            min-width: 100px;
        }
        .tomato-btn.reset-btn {
            background: #eef2f6;
            color: #1e2a3e;
            border: 1px solid #cbd5e1;
        }
        .tomato-btn:active { transform: scale(0.96); }
        .status-text {
            font-size: 0.85rem;
            color: #5b6e8c;
            background: #eef2ff;
            padding: 6px 18px;
            border-radius: 30px;
            margin-top: 6px;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* 模态框 */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .settings-modal.open {
            visibility: visible;
            opacity: 1;
        }
        .settings-card {
            background: white;
            width: 90%;
            max-width: 620px;
            max-height: 85vh;
            border-radius: 32px;
            padding: 20px 24px;
            overflow-y: auto;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .settings-card h2 { font-size: 1.4rem; font-weight: 520; padding-left: 8px; }
        .setting-group { padding-bottom: 16px; border-bottom: 1px solid #eef2f8; }
        .setting-group:last-child { border-bottom: none; }
        .setting-group h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: #2c3e4e; }
        .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; align-items: center; }
        .color-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        label { font-size: 0.8rem; min-width: 70px; color: #4a627a; }
        input[type="color"] { width: 48px; height: 38px; border-radius: 12px; cursor: pointer; }
        input[type="range"] { width: 140px; }
        .file-input-label { background: #eef2f6; padding: 6px 14px; border-radius: 30px; font-size: 0.75rem; cursor: pointer; display: inline-block; font-weight: 500; }
        .bg-preview { margin-top: 10px; max-width: 100%; max-height: 100px; overflow: hidden; }
        .bg-preview img { max-width: 100%; max-height: 100px; object-fit: cover; border-radius: 12px; }
        .remove-bg-btn { background: #ffece5; border: none; padding: 5px 14px; border-radius: 24px; font-size: 0.7rem; cursor: pointer; }
        input[type="file"] { display: none; }
        .save-btn { background: #1e2a3e; color: white; border: none; padding: 12px; border-radius: 60px; font-weight: 600; margin-top: 6px; cursor: pointer; }
        .close-modal { background: none; border: 1px solid #e2e8f0; padding: 10px; border-radius: 60px; margin-top: 6px; cursor: pointer; font-weight: 500; }
        .flex-btns { display: flex; gap: 14px; }
        .emoji-manager { background: #fafcff; border-radius: 24px; padding: 12px; margin-top: 6px; }
        .emoji-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; max-height: 200px; overflow-y: auto; }
        .emoji-item { position: relative; display: inline-block; cursor: pointer; }
        .emoji-item img { width: 62px; height: 62px; object-fit: cover; border-radius: 14px; border: 1px solid #eef2f8; }
        .delete-emoji { position: absolute; top: -6px; right: -6px; background: rgba(0,0,0,0.65); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; opacity: 0; transition: 0.1s; }
        .emoji-item:hover .delete-emoji { opacity: 1; }
        .lexicon-manager { background: #fafcff; border-radius: 24px; padding: 12px; margin-top: 6px; }
        .batch-import-area textarea { width: 100%; padding: 12px; border-radius: 20px; border: 1px solid #e2e8f0; font-size: 0.8rem; margin-bottom: 10px; resize: vertical; }
        .lexicon-preview { max-height: 150px; overflow-y: auto; padding-top: 12px; }
        .lexicon-items-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .lexicon-item-tag { background: #f1f5f9; padding: 4px 12px; border-radius: 32px; font-size: 0.7rem; display: inline-flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
<div class="chat-app" id="chatApp">
    <!-- 聊天视图 -->
    <div id="chatView" class="view">
        <div class="chat-header" id="headerArea">
            <div class="contact-header-info">
                <img class="contact-header-avatar" id="headerContactAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238ba3bc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="contact">
                <span class="contact-header-name" id="headerContactName">密友</span>
            </div>
            <div class="header-actions">
                <button class="feature-icon" id="openFeatureBtn">🦊</button>
                <button class="settings-cog" id="openSettingsBtn">⚙️</button>
            </div>
        </div>
        <div class="messages-wrapper">
            <div class="messages-bg-layer" id="messagesBgLayer"></div>
            <div class="messages-area" id="messagesContainer"></div>
        </div>
        <div class="input-area">
            <div class="input-toolbar">
                <button class="tool-icon" id="sendImageBtn" title="发送图片">📷</button>
                <button class="tool-icon" id="sendEmojiBtn" title="发送表情包">😊</button>
            </div>
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="输入消息...">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <!-- 功能视图 (番茄钟) -->
    <div id="featureView" class="view hidden">
        <div class="feature-header">
            <button class="back-btn" id="backToChatBtn">← 返回</button>
            <h2>🍅 专注番茄钟</h2>
        </div>
        <div class="feature-view">
            <div class="pomodoro-container">
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="task-section">
                    <div class="task-row">
                        <label>📌 专注事项</label>
                        <input type="text" id="taskInput" placeholder="例如: 阅读、写代码..." value="深度工作">
                    </div>
                    <div class="duration-row">
                        <label>⏱️ 时长(分钟)</label>
                        <input type="number" id="minutesInput" min="1" max="180" value="25" step="1">
                    </div>
                </div>
                <div class="control-buttons">
                    <button class="tomato-btn" id="startTimerBtn">▶ 开始</button>
                    <button class="tomato-btn" id="pauseTimerBtn">⏸ 暂停</button>
                    <button class="tomato-btn reset-btn" id="resetTimerBtn">🔄 重置</button>
                </div>
                <div class="status-text" id="timerStatus">未开始 · 设置专注事项与时长</div>
            </div>
        </div>
    </div>
</div>

<!-- 设置模态框 -->
<div id="settingsModal" class="settings-modal">
    <div class="settings-card">
        <h2>⚙️ 私人定制 · 永久保存</h2>
        <div class="setting-group"><h3>👤 我的信息</h3><div class="row"><label>昵称</label><input type="text" id="setUserName" maxlength="12"><label class="file-input-label">📷 上传头像<input type="file" id="userAvatarUpload" accept="image/*"></label></div><h3>👥 联系人信息</h3><div class="row"><label>昵称</label><input type="text" id="setContactName" maxlength="12"><label class="file-input-label">📷 上传头像<input type="file" id="contactAvatarUpload" accept="image/*"></label></div></div>
        <div class="setting-group"><h3>🖼️ 专属聊天背景</h3><div class="row"><label class="file-input-label">📸 上传背景图<input type="file" id="bgImageUpload" accept="image/*"></label><button class="remove-bg-btn" id="removeBgBtn">🗑️ 恢复默认</button></div><div id="bgPreview" class="bg-preview"></div></div>
        <div class="setting-group"><h3>🎨 主题与气泡样式</h3><div class="color-row"><label>头部/输入框</label><input type="color" id="themeColorPicker" value="#ffffff"></div><h3>💬 我的气泡</h3><div class="color-row"><label>背景色</label><input type="color" id="myBubbleColor" value="#e9eef3"><label>透明度</label><input type="range" id="myBubbleOpacity" min="0" max="1" step="0.05" value="1"><span id="myOpacityVal">100%</span></div><div class="color-row"><label>文字颜色</label><input type="color" id="myBubbleTextColor" value="#1e2a3e"></div><h3>💬 联系人气泡</h3><div class="color-row"><label>背景色</label><input type="color" id="contactBubbleColor" value="#f1f3f7"><label>透明度</label><input type="range" id="contactBubbleOpacity" min="0" max="1" step="0.05" value="1"><span id="contactOpacityVal">100%</span></div><div class="color-row"><label>文字颜色</label><input type="color" id="contactBubbleTextColor" value="#1e2a3e"></div></div>
        <div class="setting-group"><h3>😊 表情包仓库</h3><div class="emoji-manager"><div class="row"><label class="file-input-label">➕ 添加表情包<input type="file" id="addEmojiInput" accept="image/*" multiple></label><span>批量上传</span></div><div id="emojiGrid" class="emoji-grid"></div></div></div>
        <div class="setting-group"><h3>📚 字卡库</h3><div class="lexicon-manager"><div class="batch-import-area"><textarea id="batchLexiconInput" rows="3" placeholder="每行一条字卡"></textarea><button id="batchImportBtn">📥 批量导入</button><button id="clearAllLexiconBtn" style="background:#ffe6e6;">🗑️ 清空所有</button></div><div class="lexicon-preview"><div>当前字卡 <span id="lexiconCount">0</span> 条</div><div id="lexiconItemsList" class="lexicon-items-list"></div></div></div></div>
        <div class="flex-btns"><button class="save-btn" id="saveSettingsBtn">💾 永久保存所有设置</button><button class="close-modal" id="closeSettingsBtn">取消</button></div>
    </div>
</div>

<script>
    (function() {
        // ========== 存储键值 & 默认数据 ==========
        const STORAGE_KEYS = { SETTINGS: "eternal_private_chat_settings", LEXICON: "eternal_private_chat_lexicon", EMOJIS: "eternal_private_chat_emojis", MESSAGES: "eternal_private_chat_messages", BG_IMAGE: "eternal_private_chat_bg" };
        const DEFAULT_LEXICON = ["“生活原本沉闷，但跑起来就有风”","“别急，在变好”","今天的云很好看，我想拍给你看。","听首喜欢的歌吧，我陪你。","随便聊聊，什么都不想也没关系。","风很温柔，你也是。","“记得好好吃饭”","想听你分享一件小事","安心，我一直在这里。"];
        let lexicon = [], emojis = [], chatMessages = [];
        let settings = { userName: "我", contactName: "密友", userAvatar: null, contactAvatar: null, themeColor: "#ffffff", myBubbleColor: "#e9eef3", myBubbleOpacity: 1, myBubbleTextColor: "#1e2a3e", contactBubbleColor: "#f1f3f7", contactBubbleOpacity: 1, contactBubbleTextColor: "#1e2a3e", bgImage: null };
        let currentUserAvatar = null, currentContactAvatar = null, lastMessageTime = 0;
        const MESSAGE_INTERVAL = 2000, EMOJI_REPLY_PROBABILITY = 0.2;
        const DEFAULT_AVATAR_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238ba3bc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
        function removeQuotes(str) { return str ? str.replace(/["“”]/g, '') : ""; }

        function persistAll() { localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings)); localStorage.setItem(STORAGE_KEYS.LEXICON, JSON.stringify(lexicon)); localStorage.setItem(STORAGE_KEYS.EMOJIS, JSON.stringify(emojis)); localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify(chatMessages)); if(settings.bgImage) localStorage.setItem(STORAGE_KEYS.BG_IMAGE, settings.bgImage); else localStorage.removeItem(STORAGE_KEYS.BG_IMAGE); }

        function applyBubbleStyle(bubble, type) { if(bubble.classList.contains('bubble-image') || bubble.classList.contains('bubble-emoji')) return; const bg = type === 'user' ? settings.myBubbleColor : settings.contactBubbleColor; const op = type === 'user' ? settings.myBubbleOpacity : settings.contactBubbleOpacity; const textColor = type === 'user' ? settings.myBubbleTextColor : settings.contactBubbleTextColor; const r=parseInt(bg.slice(1,3),16),g=parseInt(bg.slice(3,5),16),b=parseInt(bg.slice(5,7),16); bubble.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${op})`; bubble.style.color = textColor; }

            avatar.src=msg.avatar||DEFAULT_AVATAR_SVG; 
            const contentDiv=document.createElement('div');

        // 获取随机用户消息 - 限定在最近10条以内
        function getRandomUserMessageToQuote() {
            const allUserMsgs = chatMessages.filter(m => m.type === 'user' && !m.isImage && !m.isEmoji && m.content && m.content.trim() !== '');
            if(allUserMsgs.length === 0) return null;
            const recentMsgs = allUserMsgs.slice(-10);
            if(recentMsgs.length === 0) return null;
            const randomMsg = recentMsgs[Math.floor(Math.random() * recentMsgs.length)];
            let quote = randomMsg.content;
            if(quote.length > 70) quote = quote.slice(0,67)+'...';
            return quote;
        }
        
        function getRandomReplyWithPossibleQuote() {
            const shouldQuote = Math.random() < 0.15;
            let quoteTarget = null;
            if(shouldQuote) {
                quoteTarget = getRandomUserMessageToQuote();
            }
            if(emojis.length && Math.random()<EMOJI_REPLY_PROBABILITY && !quoteTarget) return {type:'emoji', content:emojis[Math.floor(Math.random()*emojis.length)], quoteText: null};
            const cards = getRandomTextCards();
            if(quoteTarget) {
                return {type:'textArray', content: [cards[0] || "✨"], quoteText: quoteTarget };
            } else {
                return {type:'textArray', content: cards, quoteText: null };
            }
        }
        
        let replyQueue=[], isReplying=false; 
        function processReply(){ 
            if(!replyQueue.length){ isReplying=false; return; } 
            if(isReplying) return; 
            const item=replyQueue.shift(); 
            isReplying=true; 
            const delayBase=Math.random()*4000+2800; 
            if(item.type==='emoji'){ 
                setTimeout(()=>{ 
                    addMessage(item.content,'contact',false,true, item.quoteText || null); 
                    setTimeout(()=>{ isReplying=false; processReply();},200);
                },delayBase); 
            } else { 
                const cards=item.content; 
                let acc=delayBase; 
                cards.forEach((card,idx)=>{
                    const quoteForThis = (idx === 0 && item.quoteText) ? item.quoteText : null;
                    setTimeout(()=>{ 
                        addMessage(card,'contact',false,false, quoteForThis); 
                        if(idx===cards.length-1) setTimeout(()=>{ isReplying=false; processReply();},250);
                    },acc); 
                    acc+=MESSAGE_INTERVAL; 
                }); 
            } 
        }

        function renderEmojiLibrary(){ emojiGrid.innerHTML=''; if(!emojis.length){ emojiGrid.innerHTML='<div style="color:#aaa;padding:8px;">✨ 暂无表情包</div>'; return; } emojis.forEach((e,idx)=>{ const div=document.createElement('div'); div.className='emoji-item'; div.innerHTML=`<img src="${e}"><div class="delete-emoji" data-idx="${idx}">✕</div>`; div.querySelector('.delete-emoji').onclick=(ev)=>{ ev.stopPropagation(); emojis.splice(idx,1); persistAll(); renderEmojiLibrary(); }; emojiGrid.appendChild(div); }); }
