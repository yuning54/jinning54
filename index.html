<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>锦时予宁 | 永恒珍藏版 · 回声絮语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #eef2f7;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .chat-app {
            width: 100%;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        @supports (padding: max(0px)) {
            .chat-app {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
            .chat-header {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
            }
            .messages-area {
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            .input-area {
                padding-left: max(18px, env(safe-area-inset-left));
                padding-right: max(18px, env(safe-area-inset-right));
                padding-bottom: max(14px, env(safe-area-inset-bottom));
            }
        }

        .view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .view.hidden {
            display: none;
        }

        .chat-header {
            padding: 12px 16px;
            background: #ffffff;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            transition: background-color 0.2s;
        }
        
        .contact-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        
        .contact-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef2f6;
            border: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        
        .contact-header-name {
            font-weight: 600;
            font-size: 1rem;
            color: #1e2a3e;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .settings-cog, .feature-icon {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.05s linear;
            line-height: 1;
            opacity: 0.7;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .settings-cog:active, .feature-icon:active { opacity: 1; transform: scale(0.96); }

        .messages-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .messages-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            z-index: 2;
            -webkit-overflow-scrolling: touch;
        }
        
        .messages-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 100%;
            animation: fadeSlideUp 0.2s ease-out;
        }
        
        .message-row.user {
            flex-direction: row-reverse;
        }
        
        .message-row.contact {
            flex-direction: row;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #eef2f6;
        }
        
        .message-content {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            width: fit-content;
            min-width: 45px;
        }
        
        .quote-badge {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.08);
            border-left: 3px solid #9aaebf;
            padding: 5px 10px;
            margin-bottom: 5px;
            border-radius: 12px;
            color: #5b6e8c;
            max-width: 260px;
            word-break: break-word;
            white-space: pre-wrap;
            font-style: normal;
            display: inline-block;
            width: auto;
        }
        .user .quote-badge {
            background: rgba(0,0,0,0.06);
            border-left-color: #8ba3bc;
        }
        .contact .quote-badge {
            background: rgba(0,0,0,0.05);
        }
        
        .bubble {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
            transition: background-color 0.1s, color 0.1s;
            width: fit-content;
            max-width: 100%;
        }
        
        .message-content .bubble {
            display: inline-block;
        }
        
        .bubble-image {
            padding: 6px;
            max-width: 220px;
        }
        
        .bubble-image img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 14px;
            cursor: pointer;
        }
        
        .bubble-emoji {
            padding: 6px 12px;
        }
        
        .bubble-emoji img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 14px;
        }
        
        .user .bubble {
            border-bottom-right-radius: 6px;
        }
        
        .contact .bubble {
            border-bottom-left-radius: 6px;
        }
        
        .timestamp {
            font-size: 0.62rem;
            color: #9aaebf;
            margin-top: 4px;
            margin-left: 8px;
            margin-right: 8px;
        }
        
        .user .timestamp {
            text-align: right;
        }
        
        .user .message-content {
            align-items: flex-end;
        }
        
        .contact .message-content {
            align-items: flex-start;
        }

        .input-area {
            padding: 10px 16px 14px;
            background: #ffffff;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s;
        }
        
        .input-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        
        .tool-icon {
            background: none;
            border: none;
            font-size: 1.35rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.05s linear;
            opacity: 0.7;
            min-width: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tool-icon:active {
            opacity: 1;
            transform: scale(0.95);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: #f1f3f7;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
            min-height: 40px;
        }
        
        .input-wrapper input:focus {
            background: #e8ecf2;
        }

        .input-wrapper button {
            background: #f1f3f7;
            border: none;
            border-radius: 32px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.05s linear;
            min-height: 40px;
            white-space: nowrap;
        }
        
        .input-wrapper button:active {
            transform: scale(0.97);
            background: #e2e8f0;
        }

        .feature-view {
            background: #fefefe;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .feature-header {
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            background: #f0f2f5;
            border: none;
            font-size: 1.1rem;
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.05s linear;
            white-space: nowrap;
        }
        .back-btn:active { transform: scale(0.96); background: #e4e8ef; }
        .feature-header h2 {
            font-size: 1.1rem;
            font-weight: 520;
            color: #1e2a3e;
        }
        .pomodoro-container {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .timer-display {
            font-size: 3.2rem;
            font-weight: 600;
            font-family: monospace;
            letter-spacing: 2px;
            background: #f1f5f9;
            padding: 16px 24px;
            border-radius: 48px;
            color: #1e293b;
            box-shadow: inset 0 1px 3px #0001, 0 5px 12px rgba(0,0,0,0.05);
        }
        .task-section {
            width: 100%;
            max-width: 300px;
            background: #f8fafc;
            border-radius: 28px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .task-row, .duration-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .task-row label, .duration-row label {
            font-weight: 500;
            color: #334155;
            min-width: 65px;
            font-size: 0.85rem;
        }
        .task-row input, .duration-row input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            background: white;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            min-width: 120px;
        }
        .duration-row input {
            width: 90px;
            text-align: center;
        }
        .control-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }
        .tomato-btn {
            background: #1e2a3e;
            border: none;
            padding: 8px 20px;
            border-radius: 36px;
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.05s linear;
            min-width: 85px;
            min-height: 40px;
        }
        .tomato-btn.reset-btn {
            background: #eef2f6;
            color: #1e2a3e;
            border: 1px solid #cbd5e1;
        }
        .tomato-btn:active { transform: scale(0.96); }
        .status-text {
            font-size: 0.8rem;
            color: #5b6e8c;
            background: #eef2ff;
            padding: 6px 14px;
            border-radius: 28px;
            margin-top: 4px;
            text-align: center;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .settings-modal.open {
            visibility: visible;
            opacity: 1;
        }
        .settings-card {
            background: white;
            width: 92%;
            max-width: 580px;
            max-height: 85vh;
            border-radius: 28px;
            padding: 18px 20px;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 18px;
            -webkit-overflow-scrolling: touch;
        }
        .settings-card h2 { font-size: 1.25rem; font-weight: 520; padding-left: 4px; margin-bottom: 4px; }
        .setting-group { padding-bottom: 14px; border-bottom: 1px solid #eef2f8; }
        .setting-group:last-child { border-bottom: none; }
        .setting-group h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: #2c3e4e; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; }
        .color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        label { font-size: 0.75rem; min-width: 60px; color: #4a627a; }
        input[type="color"] { width: 44px; height: 36px; border-radius: 10px; cursor: pointer; }
        input[type="range"] { width: 130px; }
        .file-input-label { background: #eef2f6; padding: 5px 12px; border-radius: 28px; font-size: 0.7rem; cursor: pointer; display: inline-block; font-weight: 500; }
        .bg-preview { margin-top: 8px; max-width: 100%; max-height: 80px; overflow: hidden; }
        .bg-preview img { max-width: 100%; max-height: 80px; object-fit: cover; border-radius: 10px; }
        .remove-bg-btn { background: #ffece5; border: none; padding: 4px 12px; border-radius: 22px; font-size: 0.65rem; cursor: pointer; }
        input[type="file"] { display: none; }
        .save-btn { background: #1e2a3e; color: white; border: none; padding: 10px; border-radius: 48px; font-weight: 600; margin-top: 4px; cursor: pointer; font-size: 0.9rem; transition: 0.05s linear; }
        .close-modal { background: none; border: 1px solid #e2e8f0; padding: 10px; border-radius: 48px; margin-top: 4px; cursor: pointer; font-weight: 500; font-size: 0.9rem; transition: 0.05s linear; }
        .flex-btns { display: flex; gap: 12px; }
        .danger-btn {
            background: #fff1f0;
            border: 1px solid #ffccc7;
            color: #d4380d;
            padding: 10px;
            border-radius: 48px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.05s linear;
            text-align: center;
        }
        .danger-btn:active { transform: scale(0.97); background: #ffe7e5; }
        .emoji-manager { background: #fafcff; border-radius: 20px; padding: 10px; margin-top: 4px; }
        .emoji-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; max-height: 180px; overflow-y: auto; }
        .emoji-item { position: relative; display: inline-block; cursor: pointer; }
        .emoji-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; border: 1px solid #eef2f8; }
        .delete-emoji { position: absolute; top: -5px; right: -5px; background: rgba(0,0,0,0.7); color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; opacity: 0; transition: 0.1s; }
        .emoji-item:hover .delete-emoji { opacity: 1; }
        .lexicon-manager { background: #fafcff; border-radius: 20px; padding: 10px; margin-top: 4px; }
        .batch-import-area textarea { width: 100%; padding: 10px; border-radius: 16px; border: 1px solid #e2e8f0; font-size: 0.75rem; margin-bottom: 8px; resize: vertical; font-family: inherit; }
        .lexicon-preview { max-height: 130px; overflow-y: auto; padding-top: 8px; }
        .lexicon-items-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .lexicon-item-tag { background: #f1f5f9; padding: 3px 10px; border-radius: 28px; font-size: 0.65rem; display: inline-flex; align-items: center; gap: 6px; }
        .lexicon-item-tag button { background: none; border: none; cursor: pointer; font-size: 0.7rem; padding: 0 4px; color: #888; }
        .batch-import-area button { background: #eef2f6; border: none; padding: 5px 12px; border-radius: 24px; font-size: 0.7rem; margin-right: 8px; cursor: pointer; transition: 0.05s linear; }
        .batch-import-area button:active { transform: scale(0.96); }
        .save-btn:active, .close-modal:active { transform: scale(0.97); }
        button, .tool-icon, .settings-cog, .feature-icon, .back-btn, .tomato-btn {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
<div class="chat-app" id="chatApp">
    <div id="chatView" class="view">
        <div class="chat-header" id="headerArea">
            <div class="contact-header-info">
                <img class="contact-header-avatar" id="headerContactAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238ba3bc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="contact">
                <span class="contact-header-name" id="headerContactName">密友</span>
            </div>
            <div class="header-actions">
                <button class="feature-icon" id="openFeatureBtn">🦊</button>
                <button class="settings-cog" id="openSettingsBtn">⚙️</button>
            </div>
        </div>
        <div class="messages-wrapper">
            <div class="messages-bg-layer" id="messagesBgLayer"></div>
            <div class="messages-area" id="messagesContainer"></div>
        </div>
        <div class="input-area">
            <div class="input-toolbar">
                <button class="tool-icon" id="sendImageBtn" title="发送图片">📷</button>
                <button class="tool-icon" id="sendEmojiBtn" title="发送表情包">😊</button>
            </div>
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="输入消息...">
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <div id="featureView" class="view hidden">
        <div class="feature-header">
            <button class="back-btn" id="backToChatBtn">← 返回</button>
            <h2>🍅 专注番茄钟</h2>
        </div>
        <div class="feature-view">
            <div class="pomodoro-container">
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="task-section">
                    <div class="task-row">
                        <label>📌 专注事项</label>
                        <input type="text" id="taskInput" placeholder="例如: 阅读..." value="深度工作">
                    </div>
                    <div class="duration-row">
                        <label>⏱️ 时长(分钟)</label>
                        <input type="number" id="minutesInput" min="1" max="180" value="25" step="1">
                    </div>
                </div>
                <div class="control-buttons">
                    <button class="tomato-btn" id="startTimerBtn">▶ 开始</button>
                    <button class="tomato-btn" id="pauseTimerBtn">⏸ 暂停</button>
                    <button class="tomato-btn reset-btn" id="resetTimerBtn">🔄 重置</button>
                </div>
                <div class="status-text" id="timerStatus">未开始 · 设置专注事项与时长</div>
            </div>
        </div>
    </div>
</div>

<div id="settingsModal" class="settings-modal">
    <div class="settings-card">
        <h2>⚙️ 私人定制 · 永久保存</h2>
        <div class="setting-group"><h3>👤 我的信息</h3><div class="row"><label>昵称</label><input type="text" id="setUserName" maxlength="12" placeholder="我"><label class="file-input-label">📷 上传头像<input type="file" id="userAvatarUpload" accept="image/*"></label></div><h3>👥 联系人信息</h3><div class="row"><label>昵称</label><input type="text" id="setContactName" maxlength="12" placeholder="密友"><label class="file-input-label">📷 上传头像<input type="file" id="contactAvatarUpload" accept="image/*"></label></div></div>
        <div class="setting-group"><h3>🖼️ 专属聊天背景</h3><div class="row"><label class="file-input-label">📸 上传背景图<input type="file" id="bgImageUpload" accept="image/*"></label><button class="remove-bg-btn" id="removeBgBtn">🗑️ 恢复默认</button></div><div id="bgPreview" class="bg-preview"></div></div>
        <div class="setting-group"><h3>🎨 主题与气泡样式</h3><div class="color-row"><label>头部/输入框</label><input type="color" id="themeColorPicker" value="#ffffff"></div><h3>💬 我的气泡</h3><div class="color-row"><label>背景色</label><input type="color" id="myBubbleColor" value="#e9eef3"><label>透明度</label><input type="range" id="myBubbleOpacity" min="0" max="1" step="0.05" value="1"><span id="myOpacityVal">100%</span></div><div class="color-row"><label>文字颜色</label><input type="color" id="myBubbleTextColor" value="#1e2a3e"></div><h3>💬 联系人气泡</h3><div class="color-row"><label>背景色</label><input type="color" id="contactBubbleColor" value="#f1f3f7"><label>透明度</label><input type="range" id="contactBubbleOpacity" min="0" max="1" step="0.05" value="1"><span id="contactOpacityVal">100%</span></div><div class="color-row"><label>文字颜色</label><input type="color" id="contactBubbleTextColor" value="#1e2a3e"></div></div>
        <div class="setting-group"><h3>😊 表情包仓库</h3><div class="emoji-manager"><div class="row"><label class="file-input-label">➕ 添加表情包<input type="file" id="addEmojiInput" accept="image/*" multiple></label><span>批量上传</span></div><div id="emojiGrid" class="emoji-grid"></div></div></div>
        <div class="setting-group"><h3>📚 字卡库</h3><div class="lexicon-manager"><div class="batch-import-area"><textarea id="batchLexiconInput" rows="2" placeholder="每行一条字卡"></textarea><button id="batchImportBtn">📥 批量导入</button><button id="clearAllLexiconBtn" style="background:#ffe6e6;">🗑️ 清空所有</button></div><div class="lexicon-preview"><div>当前字卡 <span id="lexiconCount">0</span> 条</div><div id="lexiconItemsList" class="lexicon-items-list"></div></div></div></div>
        <div class="setting-group"><h3>🗑️ 危险操作区</h3><button id="clearAllMessagesBtn" class="danger-btn" style="width:100%;">⚠️ 清空所有聊天记录 (不可恢复)</button></div>
        <div class="flex-btns"><button class="save-btn" id="saveSettingsBtn">💾 永久保存所有设置</button><button class="close-modal" id="closeSettingsBtn">取消</button></div>
    </div>
</div>

<script>
    (function() {
        // ---------- IndexedDB 封装 ----------
        const DB_NAME = "EternalChatDB";
        const DB_VERSION = 1;
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                if (db && db.name === DB_NAME) { resolve(db); return; }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { db = request.result; resolve(db); };
                request.onupgradeneeded = (ev) => {
                    const dbEv = ev.target.result;
                    if (!dbEv.objectStoreNames.contains("settings")) dbEv.createObjectStore("settings", { keyPath: "id" });
                    if (!dbEv.objectStoreNames.contains("lexicon")) dbEv.createObjectStore("lexicon", { keyPath: "id", autoIncrement: true });
                    if (!dbEv.objectStoreNames.contains("emojis")) dbEv.createObjectStore("emojis", { keyPath: "id", autoIncrement: true });
                    if (!dbEv.objectStoreNames.contains("messages")) dbEv.createObjectStore("messages", { keyPath: "id" });
                };
            });
        }

        async function getStoreData(storeName, key = null) {
            const database = await openDB();
            return new Promise((resolve) => {
                const tx = database.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                let req;
                if (key !== null) req = store.get(key);
                else req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(key !== null ? null : []);
            });
        }

        async function putStoreData(storeName, data) {
            const database = await openDB();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
                tx.oncomplete = () => resolve();
            });
        }

        async function clearStore(storeName) {
            const database = await openDB();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function addToStore(storeName, item) {
            const database = await openDB();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                const req = store.add(item);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getAllItems(storeName) {
            const database = await openDB();
            return new Promise((resolve) => {
                const tx = database.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve([]);
            });
        }

        let lexicon = [], emojis = [], chatMessages = [];
        let settings = { 
            id: "appSettings", userName: "我", contactName: "密友", 
            userAvatar: null, contactAvatar: null, 
            themeColor: "#ffffff", 
            myBubbleColor: "#e9eef3", myBubbleOpacity: 1, myBubbleTextColor: "#1e2a3e",
            contactBubbleColor: "#f1f3f7", contactBubbleOpacity: 1, contactBubbleTextColor: "#1e2a3e",
            bgImage: null
        };
        let currentUserAvatar = null, currentContactAvatar = null;
        let lastMessageTime = 0;
        const MESSAGE_INTERVAL = 2000;
        const DEFAULT_AVATAR_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238ba3bc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
        const DEFAULT_LEXICON = ["“生活原本沉闷，但跑起来就有风”","“别急，在变好”","今天的云很好看，我想拍给你看。","听首喜欢的歌吧，我陪你。","随便聊聊，什么都不想也没关系。","风很温柔，你也是。","“记得好好吃饭”","想听你分享一件小事","安心，我一直在这里。"];

        function removeQuotes(str) { return str ? str.replace(/["“”]/g, '') : ""; }
        function formatTime() { const d = new Date(); return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; }
        
        async function persistAll() {
            await putStoreData("settings", settings);
            await clearStore("lexicon");
            for (let item of lexicon) await addToStore("lexicon", { text: item });
            await clearStore("emojis");
            for (let em of emojis) await addToStore("emojis", { url: em });
            await clearStore("messages");
            for (let msg of chatMessages) await putStoreData("messages", msg);
        }

        async function loadAll() {
            const savedSettings = await getStoreData("settings", "appSettings");
            if (savedSettings) Object.assign(settings, savedSettings);
            if (!settings.myBubbleTextColor) settings.myBubbleTextColor = "#1e2a3e";
            if (!settings.contactBubbleTextColor) settings.contactBubbleTextColor = "#1e2a3e";
            const lexiconItems = await getAllItems("lexicon");
            lexicon = lexiconItems.map(item => item.text);
            if (!lexicon.length) lexicon = [...DEFAULT_LEXICON];
            const emojiItems = await getAllItems("emojis");
            emojis = emojiItems.map(e => e.url);
            const msgItems = await getAllItems("messages");
            chatMessages = msgItems.sort((a,b) => a.id - b.id);
        }

        function compressImage(file, maxWidth=400, quality=0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        
        function applyBubbleStyle(bubble, type) { 
            if (bubble.classList.contains('bubble-image') || bubble.classList.contains('bubble-emoji')) return;
            const bg = type === 'user' ? settings.myBubbleColor : settings.contactBubbleColor;
            const op = type === 'user' ? settings.myBubbleOpacity : settings.contactBubbleOpacity;
            const textColor = type === 'user' ? settings.myBubbleTextColor : settings.contactBubbleTextColor;
            const r = parseInt(bg.slice(1,3),16), g = parseInt(bg.slice(3,5),16), b = parseInt(bg.slice(5,7),16);
            bubble.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${op})`;
            bubble.style.color = textColor;
        }
        
        function renderMessageToDOM(msg) {
            const row = document.createElement('div');
            row.className = `message-row ${msg.type}`;
            const avatar = document.createElement('img');
            avatar.className = 'message-avatar';
            avatar.src = msg.avatar || DEFAULT_AVATAR_SVG;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (msg.quoteText && msg.quoteText.trim()) {
                const quoteDiv = document.createElement('div');
                quoteDiv.className = 'quote-badge';
                quoteDiv.innerText = msg.quoteText;
                contentDiv.appendChild(quoteDiv);
            }
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (msg.isImage) {
                bubble.classList.add('bubble-image');
                const img = document.createElement('img');
                img.src = msg.content;
                bubble.appendChild(img);
            } else if (msg.isEmoji) {
                bubble.classList.add('bubble-emoji');
                const img = document.createElement('img');
                img.src = msg.content;
                bubble.appendChild(img);
            } else {
                bubble.innerText = msg.content;
                applyBubbleStyle(bubble, msg.type);
            }
            const timeSpan = document.createElement('div');
            timeSpan.className = 'timestamp';
            timeSpan.innerText = msg.time;
            contentDiv.appendChild(bubble);
            contentDiv.appendChild(timeSpan);
            row.appendChild(avatar);
            row.appendChild(contentDiv);
            row.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                let quoteContent = '';
                if (msg.isImage) quoteContent = '[图片]';
                else if (msg.isEmoji) quoteContent = '[表情包]';
                else quoteContent = msg.content;
                if (quoteContent.length > 80) quoteContent = quoteContent.slice(0,77)+'...';
                window.pendingQuote = { text: quoteContent };
                const hintDiv = document.createElement('div');
                hintDiv.innerText = "已引用: " + quoteContent.slice(0,30);
                hintDiv.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e2a3ecc;color:white;padding:5px 14px;border-radius:28px;font-size:0.75rem;z-index:3000;backdrop-filter:blur(4px);max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
                document.body.appendChild(hintDiv);
                setTimeout(() => hintDiv.remove(), 1600);
            });
            return row;
        }
        
        function renderAllMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            chatMessages.forEach(m => container.appendChild(renderMessageToDOM(m)));
            container.scrollTop = container.scrollHeight;
        }
        
        async function addMessage(content, type, isImage = false, isEmoji = false, quoteText = null) {
            const msg = {
                id: Date.now() + Math.random(),
                type, content, isImage, isEmoji,
                time: formatTime(),
                avatar: type === 'user' ? currentUserAvatar : currentContactAvatar,
                quoteText: quoteText || null
            };
            chatMessages.push(msg);
            await persistAll();
            const container = document.getElementById('messagesContainer');
            container.appendChild(renderMessageToDOM(msg));
            container.scrollTop = container.scrollHeight;
            return msg;
        }
        
        async function clearAllChatHistory() {
            if (confirm("⚠️ 警告：清空所有聊天记录后无法恢复！\n确定要永久删除全部消息吗？")) {
                chatMessages = [];
                await persistAll();
                renderAllMessages();
                const hintDiv = document.createElement('div');
                hintDiv.innerText = "✅ 聊天记录已全部清空";
                hintDiv.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e2a3ecc;color:white;padding:5px 14px;border-radius:28px;font-size:0.75rem;z-index:3000;backdrop-filter:blur(4px);';
                document.body.appendChild(hintDiv);
                setTimeout(() => hintDiv.remove(), 1600);
            }
        }
        
        function applyBg() {
            const bgLayer = document.getElementById('messagesBgLayer');
            if (settings.bgImage && settings.bgImage !== 'null') {
                bgLayer.style.backgroundImage = `url(${settings.bgImage})`;
                bgLayer.style.backgroundSize = 'cover';
                bgLayer.style.backgroundPosition = 'center';
            } else {
                bgLayer.style.backgroundImage = '';
            }
        }
        
        function refreshUserInfo() {
            document.getElementById('headerContactName').innerText = settings.contactName || "密友";
            currentUserAvatar = settings.userAvatar;
            currentContactAvatar = settings.contactAvatar;
            document.getElementById('headerContactAvatar').src = (settings.contactAvatar && settings.contactAvatar !== 'null') ? settings.contactAvatar : DEFAULT_AVATAR_SVG;
            renderAllMessages();
        }
        
        function applyThemeAndBubbles() {
            document.getElementById('headerArea').style.backgroundColor = settings.themeColor;
            document.querySelector('.input-area').style.backgroundColor = settings.themeColor;
            document.querySelectorAll('.message-row .bubble:not(.bubble-image):not(.bubble-emoji)').forEach(b => {
                const row = b.closest('.message-row');
                if (row) applyBubbleStyle(b, row.classList.contains('user') ? 'user' : 'contact');
            });
        }
        
        // 回复逻辑 (无延迟)
        function getRandomTextCards() {
            if (!lexicon.length) return ["✨ 静谧时刻，添加一些字卡吧"];
            const count = Math.floor(Math.random() * 3) + 1;
            const selected = [];
            const shuffled = [...lexicon];
            for (let i = 0; i < count && shuffled.length; i++) {
                const randIndex = Math.floor(Math.random() * shuffled.length);
                selected.push(removeQuotes(shuffled[randIndex]).trim() || "…");
                shuffled.splice(randIndex, 1);
            }
            return selected;
        }
        
        function getRandomReply() {
            const hasEmojis = emojis && emojis.length > 0;
            if (hasEmojis && Math.random() < 0.18) {
                const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                return { type: 'emoji', content: randomEmoji, quoteText: null };
            }
            let quoteTarget = null;
            if (Math.random() < 0.15) {
                const userTextMsgs = chatMessages.filter(m => m.type === 'user' && !m.isImage && !m.isEmoji && m.content && m.content.trim());
                if (userTextMsgs.length) {
                    const recent = userTextMsgs.slice(-10);
                    const randomMsg = recent[Math.floor(Math.random() * recent.length)];
                    if (randomMsg) quoteTarget = randomMsg.content.length > 70 ? randomMsg.content.slice(0,67)+'...' : randomMsg.content;
                }
            }
            const textArray = getRandomTextCards();
            return { type: 'textArray', content: textArray, quoteText: quoteTarget };
        }
        
        let replyQueue = [], isReplying = false;
        function processReply() {
            if (!replyQueue.length) { isReplying = false; return; }
            if (isReplying) return;
            const item = replyQueue.shift();
            isReplying = true;
            let firstDelay = item.delayFirst !== undefined ? item.delayFirst : (3000 + Math.random() * 4000);
            if (item.type === 'emoji') {
                setTimeout(() => {
                    addMessage(item.content, 'contact', false, true, item.quoteText);
                    setTimeout(() => { isReplying = false; processReply(); }, 200);
                }, firstDelay);
            } else {
                const cards = item.content;
                let cumulative = firstDelay;
                cards.forEach((card, idx) => {
                    const quoteForThis = (idx === 0 && item.quoteText) ? item.quoteText : null;
                    setTimeout(() => {
                        addMessage(card, 'contact', false, false, quoteForThis);
                        if (idx === cards.length - 1) {
                            setTimeout(() => { isReplying = false; processReply(); }, 200);
                        }
                    }, cumulative);
                    cumulative += 2000;
                });
            }
        }
        
        function triggerContactReply() {
            const replyObj = getRandomReply();
            const delayFirstMs = 3000 + Math.random() * 4000;
            if (replyObj.type === 'emoji') {
                replyQueue.push({ type: 'emoji', content: replyObj.content, quoteText: replyObj.quoteText, delayFirst: delayFirstMs });
            } else {
                replyQueue.push({ type: 'textArray', content: replyObj.content, quoteText: replyObj.quoteText, delayFirst: delayFirstMs });
            }
            processReply();
        }
        
        let userReplyTimer = null;
        function onUserAction() {
            if (userReplyTimer) clearTimeout(userReplyTimer);
            userReplyTimer = setTimeout(() => triggerContactReply(), 300);
        }
        
        function canSendMessage() {
            const now = Date.now();
            if (now - lastMessageTime >= MESSAGE_INTERVAL) {
                lastMessageTime = now;
                return true;
            }
            alert(`请等待 ${Math.ceil((MESSAGE_INTERVAL - (now - lastMessageTime)) / 1000)} 秒`);
            return false;
        }
        
        function sendUserText() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            if (!canSendMessage()) return;
            let quote = null;
            if (window.pendingQuote && window.pendingQuote.text) {
                quote = window.pendingQuote.text;
                window.pendingQuote = null;
            }
            addMessage(text, 'user', false, false, quote);
            input.value = '';
            onUserAction();
        }
        
        // 番茄钟逻辑
        let timerInterval = null, remainingSeconds = 25 * 60, isTimerRunning = false;
        const timerDisplay = document.getElementById('timerDisplay');
        const minutesInput = document.getElementById('minutesInput');
        const taskInput = document.getElementById('taskInput');
        const timerStatus = document.getElementById('timerStatus');
        function updateTimerDisplay() { const mins = Math.floor(remainingSeconds / 60); const secs = remainingSeconds % 60; timerDisplay.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`; }
        function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } isTimerRunning = false; }
        function startTimer() { if (isTimerRunning) return; if (remainingSeconds <= 0) resetTimer(); isTimerRunning = true; timerInterval = setInterval(() => { if (remainingSeconds <= 0) { stopTimer(); timerStatus.innerText = `✅ 专注完成！「${taskInput.value}」时间到～`; } else { remainingSeconds--; updateTimerDisplay(); timerStatus.innerText = `⏳ 专注中：${taskInput.value || "专注"} · ${Math.floor(remainingSeconds/60)}分${remainingSeconds%60}秒`; } }, 1000); }
        function pauseTimer() { stopTimer(); if (remainingSeconds > 0) timerStatus.innerText = `⏸ 已暂停 · 「${taskInput.value || "未命名"}」`; }
        function resetTimer() { stopTimer(); let mins = parseInt(minutesInput.value); if (isNaN(mins) || mins < 1) mins = 25; remainingSeconds = mins * 60; updateTimerDisplay(); timerStatus.innerText = `重置为 ${mins} 分钟 · 「${taskInput.value || "无"}」待开始`; }
        
        // 事件绑定 (无延迟优化)
        window.onload = async () => {
            await loadAll();
            applyBg();
            refreshUserInfo();
            applyThemeAndBubbles();
            renderAllMessages();
            
            const modal = document.getElementById('settingsModal');
            const chatView = document.getElementById('chatView');
            const featureViewElem = document.getElementById('featureView');
            
            function renderEmojiUI() { const grid = document.getElementById('emojiGrid'); grid.innerHTML = ''; if (!emojis.length) { grid.innerHTML = '<div style="color:#aaa;padding:8px;">✨ 暂无表情包</div>'; return; } emojis.forEach((e, idx) => { const div = document.createElement('div'); div.className = 'emoji-item'; div.innerHTML = `<img src="${e}"><div class="delete-emoji" data-idx="${idx}">✕</div>`; div.querySelector('.delete-emoji').onclick = async (ev) => { ev.stopPropagation(); emojis.splice(idx, 1); await persistAll(); renderEmojiUI(); }; grid.appendChild(div); }); }
            function renderLexiconUI() { document.getElementById('lexiconCount').innerText = lexicon.length; const list = document.getElementById('lexiconItemsList'); list.innerHTML = ''; if (!lexicon.length) { list.innerHTML = '<div style="color:#aaa;">暂无字卡</div>'; return; } lexicon.forEach((item, idx) => { const tag = document.createElement('div'); tag.className = 'lexicon-item-tag'; const short = removeQuotes(item).length > 24 ? removeQuotes(item).slice(0,24)+'…' : removeQuotes(item); tag.innerHTML = `<span title="${item.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}">${short}</span><button data-idx="${idx}">✕</button>`; list.appendChild(tag); }); document.querySelectorAll('#lexiconItemsList button').forEach(btn => { btn.onclick = async () => { const idx = parseInt(btn.getAttribute('data-idx')); if (!isNaN(idx)) { lexicon.splice(idx, 1); await persistAll(); renderLexiconUI(); } }; }); }
            
            renderEmojiUI(); renderLexiconUI();
            
            document.getElementById('sendBtn').onclick = () => sendUserText();
            document.getElementById('messageInput').onkeypress = (e) => { if (e.key === 'Enter') sendUserText(); };
            document.getElementById('sendImageBtn').onclick = async () => { if (!canSendMessage()) return; const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = async (e) => { const file = e.target.files[0]; if (file) { const compressed = await compressImage(file, 450, 0.7); if (compressed) { addMessage(compressed, 'user', true, false, null); onUserAction(); } } }; input.click(); };
            document.getElementById('sendEmojiBtn').onclick = () => { if (!canSendMessage()) return; if (!emojis.length) { alert('请先在设置中添加表情包'); return; } const overlay = document.createElement('div'); overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;'; const panel = document.createElement('div'); panel.style.cssText = 'background:#fff;border-radius:24px;padding:16px;max-width:320px;max-height:65vh;overflow-y:auto;'; panel.innerHTML = '<h4 style="margin-bottom:12px;">选择表情包</h4><div style="display:flex;flex-wrap:wrap;gap:10px;"></div><button style="margin-top:12px;padding:6px 16px;background:#eef2f6;border:none;border-radius:28px;">取消</button>'; const grid = panel.querySelector('div'); emojis.forEach(emoji => { const img = document.createElement('img'); img.src = emoji; img.style.cssText = 'width:58px;height:58px;border-radius:12px;cursor:pointer;object-fit:cover;'; img.onclick = () => { addMessage(emoji, 'user', false, true, null); onUserAction(); document.body.removeChild(overlay); }; grid.appendChild(img); }); panel.querySelector('button').onclick = () => document.body.removeChild(overlay); overlay.appendChild(panel); document.body.appendChild(overlay); };
            
            document.getElementById('openSettingsBtn').onclick = () => { 
                document.getElementById('setUserName').value = settings.userName; document.getElementById('setContactName').value = settings.contactName;
                document.getElementById('themeColorPicker').value = settings.themeColor;
                document.getElementById('myBubbleColor').value = settings.myBubbleColor; document.getElementById('myBubbleOpacity').value = settings.myBubbleOpacity;
                document.getElementById('myBubbleTextColor').value = settings.myBubbleTextColor;
                document.getElementById('contactBubbleColor').value = settings.contactBubbleColor; document.getElementById('contactBubbleOpacity').value = settings.contactBubbleOpacity;
                document.getElementById('contactBubbleTextColor').value = settings.contactBubbleTextColor;
                document.getElementById('myOpacityVal').innerText = Math.round(settings.myBubbleOpacity * 100) + '%';
                document.getElementById('contactOpacityVal').innerText = Math.round(settings.contactBubbleOpacity * 100) + '%';
                document.getElementById('bgPreview').innerHTML = settings.bgImage ? `<img src="${settings.bgImage}">` : '<div>未设置背景</div>';
                renderEmojiUI(); renderLexiconUI(); modal.classList.add('open');
            };
            document.getElementById('closeSettingsBtn').onclick = () => modal.classList.remove('open');
            document.getElementById('saveSettingsBtn').onclick = async () => { 
                settings.userName = document.getElementById('setUserName').value.trim() || "我"; settings.contactName = document.getElementById('setContactName').value.trim() || "密友";
                settings.themeColor = document.getElementById('themeColorPicker').value;
                settings.myBubbleColor = document.getElementById('myBubbleColor').value; settings.myBubbleOpacity = parseFloat(document.getElementById('myBubbleOpacity').value);
                settings.myBubbleTextColor = document.getElementById('myBubbleTextColor').value;
                settings.contactBubbleColor = document.getElementById('contactBubbleColor').value; settings.contactBubbleOpacity = parseFloat(document.getElementById('contactBubbleOpacity').value);
                settings.contactBubbleTextColor = document.getElementById('contactBubbleTextColor').value;
                await persistAll(); refreshUserInfo(); applyThemeAndBubbles(); modal.classList.remove('open'); alert("所有个性化已永久保存✨");
            };
            document.getElementById('clearAllMessagesBtn').onclick = clearAllChatHistory;
            document.getElementById('userAvatarUpload').onchange = async e => { if(e.target.files[0]){ const compressed = await compressImage(e.target.files[0], 180, 0.7); if(compressed){ settings.userAvatar = compressed; await persistAll(); refreshUserInfo(); } } e.target.value = ''; };
            document.getElementById('contactAvatarUpload').onchange = async e => { if(e.target.files[0]){ const compressed = await compressImage(e.target.files[0], 180, 0.7); if(compressed){ settings.contactAvatar = compressed; await persistAll(); refreshUserInfo(); } } e.target.value = ''; };
            document.getElementById('bgImageUpload').onchange = async e => { if(e.target.files[0]){ const compressed = await compressImage(e.target.files[0], 1000, 0.7); if(compressed){ settings.bgImage = compressed; applyBg(); await persistAll(); document.getElementById('bgPreview').innerHTML = `<img src="${compressed}">`; } } e.target.value = ''; };
            document.getElementById('removeBgBtn').onclick = async () => { settings.bgImage = null; applyBg(); await persistAll(); document.getElementById('bgPreview').innerHTML = '<div>未设置背景</div>'; };
            document.getElementById('myBubbleOpacity').oninput = () => document.getElementById('myOpacityVal').innerText = Math.round(document.getElementById('myBubbleOpacity').value * 100) + '%';
            document.getElementById('contactBubbleOpacity').oninput = () => document.getElementById('contactOpacityVal').innerText = Math.round(document.getElementById('contactBubbleOpacity').value * 100) + '%';
            document.getElementById('addEmojiInput').onchange = async e => { const files = Array.from(e.target.files); for (let f of files) { if (f.type.startsWith('image/')) { const compressed = await compressImage(f, 160, 0.85); if (compressed && !emojis.includes(compressed)) emojis.push(compressed); } } await persistAll(); renderEmojiUI(); alert('表情包已更新'); e.target.value = ''; };
            document.getElementById('batchImportBtn').onclick = async () => { const text = document.getElementById('batchLexiconInput').value; if (!text.trim()) return; const lines = text.split(/\r?\n/); let added = 0; lines.forEach(l => { const t = l.trim(); if (t && !lexicon.includes(t)) { lexicon.push(t); added++; } }); if (added) { await persistAll(); renderLexiconUI(); document.getElementById('batchLexiconInput').value = ''; alert(`成功添加 ${added} 条字卡`); } else alert('没有新增'); };
            document.getElementById('clearAllLexiconBtn').onclick = async () => { if (confirm('永久删除所有字卡？')) { lexicon = []; await persistAll(); renderLexiconUI(); } };
            document.getElementById('startTimerBtn').onclick = startTimer;
            document.getElementById('pauseTimerBtn').onclick = pauseTimer;
            document.getElementById('resetTimerBtn').onclick = resetTimer;
            minutesInput.onchange = () => { if (!isTimerRunning) resetTimer(); };
            document.getElementById('openFeatureBtn').onclick = () => { chatView.classList.add('hidden'); featureViewElem.classList.remove('hidden'); stopTimer(); resetTimer(); };
            document.getElementById('backToChatBtn').onclick = () => { featureViewElem.classList.add('hidden'); chatView.classList.remove('hidden'); stopTimer(); };
            if (chatMessages.length === 0) { setTimeout(() => addMessage("这里只属于我们。所有设置都会永久保存✨", 'contact'), 400); setTimeout(() => addMessage("双击消息可引用，我每次会从字卡库随机回复1~3条，间隔2秒，首条延迟3~7秒。表情包概率18% ✨", 'contact'), 1800); }
            lastMessageTime = Date.now();
            window.pendingQuote = null;
        };
    })();
</script>
</body>
</html>
